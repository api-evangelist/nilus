name: Nilus
description: >-
  Nilus is an AI-powered treasury management platform ("your agentic workforce for
  treasury") that gives finance teams real-time cash visibility across banks, entities
  and currencies. Its modular platform pairs pre-built AI agents with connectivity to
  20,000+ banks and payment service providers (via SWIFT, host-to-host and API) and
  major ERPs (SAP, Oracle, NetSuite, Dynamics 365) to automate reconciliation,
  cash-flow forecasting, payment workflows, FX exposure tracking, debt-covenant
  monitoring and idle-cash investment. Founded in 2021 by Daniel Kalish (ex-PayPal)
  and Danielle Shaul (ex-Fundbox), Nilus is based in New York with a Tel Aviv presence,
  is backed by Bessemer Venture Partners, Felicis and Vesey Ventures, and serves
  customers including Alloy, Taboola, Made In Cookware and Planned Parenthood. Nilus
  operates as a closed B2B SaaS and does not currently publish a public developer API,
  OpenAPI contract or developer portal.
